name: Automatic code cleanup

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize cleanup runs; never interrupt a run while it is committing changes.
concurrency:
  group: code-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Start from the current branch tip, including any newer merged changes.
          ref: main

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lattice.slnx

      - name: Format whitespace
        run: dotnet format whitespace Lattice.slnx --no-restore

      - name: Clean up code style
        # Leave unused parameters for manual cleanup; no automatic code fix exists.
        run: dotnet format style Lattice.slnx --no-restore --severity info --exclude-diagnostics IDE0060

      # GITHUB_TOKEN pushes do not trigger CI again, so validate before pushing.
      - name: Build cleaned code
        run: dotnet build Lattice.slnx --configuration Release --no-restore

      - name: Test cleaned code
        run: dotnet test Lattice.slnx --configuration Release --no-build

      - name: Commit and push cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cs'
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage cleanup changes." }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No cleanup changes to commit."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "Failed to inspect cleanup changes." }

          git commit -m "style: apply automatic code cleanup"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit cleanup changes." }

          # Do not force-push or bypass protections. If main advanced, a later
          # cleanup run can format the new tip; this run fails without overwriting it.
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Cleanup push failed. Check branch protection or concurrent changes to main."
          }
