name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Lattice.slnx

      - name: Build
        run: dotnet build Lattice.slnx --configuration Release --no-restore

      - name: Test
        # Lattice.Core.Tests references Microsoft.NET.Test.Sdk and
        # xunit.runner.visualstudio, so VSTest can run the suite through
        # `dotnet test` rather than invoking the test assembly directly.
        run: dotnet test Lattice.slnx --configuration Release --no-build
